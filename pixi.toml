[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[environments]
default = ["site", "lint"]
# Only what the build needs.
ci = ["site"]

[feature.site]
dependencies = {
  python = "3.14.*",
}

[feature.site.tasks]
# Download the provider directories again, into data/.
# Not dependencies of `build`, so the site is built from the committed data.
# ~1 min
fetch-dosuba = "python src/fetch_dosuba.py data/dosuba/cartilla.csv"
# ~10 min
fetch-unionpersonal = "python src/fetch_unionpersonal.py data/unionpersonal/cartilla.csv"
fetch = { depends-on = ["fetch-dosuba", "fetch-unionpersonal"] }
# Geocode the providers for the map. Only new addresses reach the network:
# the rest come from the caches in data/, which are committed.
geocode-dosuba = {
  cmd = "python src/geocode_cartilla.py data/dosuba/cartilla.csv data/dosuba/geocode_cache.json dist/dosuba.json",
  inputs = [
    "src/geocode_cartilla.py",
    "data/dosuba/cartilla.csv",
    "data/dosuba/geocode_cache.json",
  ],
  outputs = [
    "dist/dosuba.json",
  ]
}
geocode-unionpersonal = {
  cmd = "python src/geocode_cartilla.py data/unionpersonal/cartilla.csv data/unionpersonal/geocode_cache.json dist/unionpersonal.json",
  inputs = [
    "src/geocode_cartilla.py",
    "data/unionpersonal/cartilla.csv",
    "data/unionpersonal/geocode_cache.json",
  ],
  outputs = [
    "dist/unionpersonal.json",
  ]
}
# What is published to GitHub Pages.
build = {
  cmd = "cp src/index.html dist",
  depends-on = [
    "geocode-dosuba",
    "geocode-unionpersonal",
  ]
}
serve = { cmd = "python -m http.server --directory dist 8000", depends-on = ["build"] }

[feature.lint]
dependencies = {
  actionlint = "*",
  prek = "*",
  ruff = "*",
  tombi = "*",
  zizmor = "*",
}
tasks = {
  lint = "prek run --all-files",
}
