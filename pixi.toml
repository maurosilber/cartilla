[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[environments]
default = ["site", "lint"]
# Only what the build needs.
ci = ["site"]

[feature.site]
dependencies = {
  python = "3.14.*",
}

[feature.site.tasks]
# Downloads the provider directory again (~1 min), into data/.
# Not a dependency of `build`, so the site is built from the committed data.
fetch = "python src/fetch_cartilla.py data/cartilla.csv"
# Geocodes the providers for the map. Only new addresses reach the network:
# the rest come from the cache in data/, which is committed.
geocode = {
  cmd = "python src/geocode_cartilla.py data/cartilla.csv data/geocode_cache.json dist/cartilla.js",
  inputs = [
    "src/geocode_cartilla.py",
    "data/cartilla.csv",
    "data/geocode_cache.json",
  ],
  outputs = [
    "dist/cartilla.js",
  ]
}
# What is published to GitHub Pages.
build = {
  cmd = "cp src/index.html dist",
  depends-on = [
    "geocode",
  ]
}
serve = { cmd = "python -m http.server --directory dist 8000", depends-on = ["build"] }

[feature.lint]
dependencies = {
  actionlint = "*",
  prek = "*",
  ruff = "*",
  tombi = "*",
  zizmor = "*",
}
tasks = {
  lint = "prek run --all-files",
}
