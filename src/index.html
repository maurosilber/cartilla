<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartillas DOSUBA y Unión Personal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Each obra social has its own color (--<os>: text and borders, --<os>-hl: fills,
     --<os>-marker: map dots); the page takes it as accent while it is the only one shown. */
  :root {
    --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6;
    --dosuba: #1a7f5a; --dosuba-hl: #eef7f2; --dosuba-marker: #1a7f5a;
    --unionpersonal: #2b4a9c; --unionpersonal-hl: #eef2fa; --unionpersonal-marker: #2b4a9c;
    --both: #4a5568; --both-hl: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #ececee; --muted: #9a9aa0; --line: #2c2d30;
      --dosuba: #4cc58f; --dosuba-hl: #1d2a24;
      --unionpersonal: #7ea2ff; --unionpersonal-hl: #1d2433;
      --both: #8f9bb0; --both-hl: #23262b;
    }
  }
  :root, :root[data-os="dosuba"] { --accent: var(--dosuba); --hl: var(--dosuba-hl); }
  :root[data-os="unionpersonal"] { --accent: var(--unionpersonal); --hl: var(--unionpersonal-hl); }
  :root[data-os="both"] { --accent: var(--both); --hl: var(--both-hl); }
  .os-dosuba { --c: var(--dosuba); --c-hl: var(--dosuba-hl); --c-marker: var(--dosuba-marker); }
  .os-unionpersonal { --c: var(--unionpersonal); --c-hl: var(--unionpersonal-hl); --c-marker: var(--unionpersonal-marker); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Header on top, map and table filling the rest of the viewport. */
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  /* Obra social toggles: a pill per cartilla, with the color of its map dots. */
  #os { display: flex; flex-wrap: wrap; gap: 6px; }
  label.os { flex-direction: row; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 8px; cursor: pointer; user-select: none; }
  label.os input { accent-color: var(--c-marker); margin: 0; }
  label.os:has(input:checked) { color: var(--c); border-color: var(--c); background: var(--c-hl); }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  input, select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 4px; }
  /* Filters sit above the table they filter, in groups (texto, ubicación, plan),
     each a row of fields that wraps and stretches to fill the width. */
  #filters { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #filters section { display: flex; flex-wrap: wrap; gap: 6px 12px; }
  #filters section > * { flex: 1 1 140px; min-width: 0; }
  #filters section + section { border-top: 1px solid var(--line); padding-top: 10px; }
  #filters section > h3 { flex-basis: 100%; margin: 0; font-size: 12px; font-weight: 600; }
  #filters .wide { flex: 2 1 280px; }
  #filters input, #filters select { width: 100%; min-width: 0; height: 30px; }
  #filters .row input, #filters .row select { flex: 1; }
  #filters .row button { height: 30px; padding-block: 0; }
  /* A reset button next to each filter, faded while the filter is not set. */
  #filters .reset { flex: none; width: 30px; padding: 0; color: var(--muted); }
  #filters .reset:disabled { opacity: 0.35; cursor: default; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  #filters h2 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); }
  #filters input[type=range] { padding: 0; border: 0; accent-color: var(--accent); }
  #toggle { display: none; }
  /* Shown over the map while no cartilla is chosen. */
  #notice { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; width: max-content; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 2px 10px rgb(0 0 0 / 0.2); font-weight: 600; text-align: center; }
  #main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); flex: 1; min-height: 0; }
  #map { height: 100%; }
  #side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  #statusbar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  #status { flex: 1; color: var(--muted); }
  #tablewrap { overflow: auto; flex: 1; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--bg); cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-dir="1"]::after { content: " ▲"; }
  th[data-dir="-1"]::after { content: " ▼"; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.sel { background: var(--hl); }
  td.dist { white-space: nowrap; text-align: right; }
  .small { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; margin: 0 2px 2px 0; border-radius: 999px; background: var(--c-hl); color: var(--c); border: 1px solid var(--c); white-space: nowrap; }
  .badge.name { font-weight: 600; }
  .leaflet-popup-content { font-size: 13px; }
  .phone { display: block; }
  .wa { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: #25d366; }
  @media (max-width: 800px) {
    /* 16px keeps iOS from zooming in when an input gets focus. */
    body, input, select, button { font-size: 16px; }
    body { display: block; height: auto; }
    header { padding: 10px 12px; gap: 8px; }
    input, select, button { padding: 8px 10px; }
    #toggle { display: block; }
    #filters { display: none; }
    #filters h2 { display: none; }
    #side.open #filters { display: flex; }
    /* The panel opens below the Filtros button, so the button stays in place. */
    #statusbar { order: -1; }
    #filters section > * { flex-basis: 100%; }
    #filters input, #filters select, #filters .row button { height: auto; }
    #filters .reset { width: 40px; }
    #main { grid-template-columns: minmax(0, 1fr); height: auto; }
    #map { height: 45vh; height: 45dvh; }
    #side { border-left: 0; }
    #tablewrap { overflow: visible; }
    /* Results as cards; the header becomes a row of sort buttons. */
    table, tbody { display: block; }
    thead { display: block; position: sticky; top: 0; z-index: 1000; background: var(--bg); border-bottom: 1px solid var(--line); }
    thead tr { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; }
    th { position: static; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: normal; color: var(--muted); }
    th[data-dir] { color: var(--fg); border-color: var(--accent); }
    tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td { display: block; padding: 0; border: 0; }
    td.nombre { grid-row: 1; grid-column: 1; font-weight: 600; }
    td.dist { grid-row: 1; grid-column: 2; }
    td.dist.none { display: none; }
    td.direccion, td.esp, td.tel, td.plan { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Cartilla
    <span id="os" role="group" aria-label="Obra social">
      <label class="os os-dosuba"><input type="checkbox" value="dosuba">DOSUBA</label>
      <label class="os os-unionpersonal"><input type="checkbox" value="unionpersonal">Unión Personal</label>
    </span>
  </h1>
</header>
<div id="main">
  <div id="notice" hidden>Elegí una cartilla (DOSUBA o Unión Personal) arriba para ver sus prestadores.</div>
  <div id="map"></div>
  <div id="side">
    <div id="filters">
      <h2>Filtros</h2>
      <section role="group">
        <span class="row">
          <input id="q" type="search" aria-label="Texto" placeholder="nombre, dirección, especialidad, teléfono…">
          <button class="reset" data-reset="q" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
        </span>
      </section>
      <section role="group">
        <label class="wide">Dirección, clic en el mapa o GPS
          <span class="row">
            <input id="addr" type="search" enterkeyhint="search" autocomplete="street-address" placeholder="ej. Av. Santa Fe 2245">
            <button id="go" class="primary">Buscar</button>
            <button id="gps" title="Usar mi ubicación">📍</button>
            <button class="reset" data-reset="addr" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
          </span>
        </label>
        <label><span>Distancia máx.: <span id="rv"></span></span>
          <span class="row">
            <input id="radius" type="range" min="0" step="1">
            <button class="reset" data-reset="radius" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
          </span>
        </label>
      </section>
      <section role="group">
        <label>Plan
          <span class="row">
            <select id="plan"><option value="">Todos</option></select>
            <button class="reset" data-reset="plan" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
          </span>
        </label>
        <label id="tipo-label">Tipo
          <span class="row">
            <select id="tipo"><option value="">Todos</option></select>
            <button class="reset" data-reset="tipo" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
          </span>
        </label>
        <label>Especialidad
          <span class="row">
            <input id="esp" type="search" list="esps" placeholder="Todas">
            <button class="reset" data-reset="esp" title="Quitar este filtro" aria-label="Quitar este filtro">✕</button>
          </span>
          <datalist id="esps"></datalist>
        </label>
      </section>
    </div>
    <div id="statusbar">
      <span id="status"></span>
      <button id="toggle" class="primary" aria-expanded="false" aria-controls="filters">Filtros</button>
    </div>
    <div id="tablewrap">
      <table>
        <thead><tr>
          <th data-k="dist">Dist.</th>
          <th data-k="nombre">Nombre</th>
          <th data-k="direccion">Dirección</th>
          <th data-k="especialidades">Especialidades</th>
          <th data-k="telefonos">Contacto</th>
          <th data-k="plan">Plan</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// The cartillas' phones mark WhatsApp numbers with "WhatsApp" (see geocode_cartilla.py),
// shown as its icon (from Simple Icons).
const WA_ICON = `<svg class="wa" viewBox="0 0 24 24" role="img" aria-label="WhatsApp"><title>WhatsApp</title><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;
const escTel = (s) => esc(s).replaceAll("WhatsApp", WA_ICON);
const phones = (r) => r.phones.map((p) => `<span class="phone">${escTel(p)}</span>`).join("");
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Map
const map = L.map("map").setView([-34.6037, -58.4416], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Geocodificación: <a href="https://usig.buenosaires.gob.ar/">USIG GCBA</a>',
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const MARKER_SEL = { radius: 10, weight: 3, color: "#fff", fillColor: "#e8590c", fillOpacity: 1 };
const css = (name, el = document.documentElement) => getComputedStyle(el).getPropertyValue(name).trim();
const OS = Object.fromEntries([...document.querySelectorAll("#os input")]
  .map((c) => [c.value, { name: c.parentElement.textContent.trim(), check: c }]));
const MARKERS = Object.fromEntries(Object.entries(OS).map(([os, { check }]) =>
  [os, { radius: 6, weight: 1, color: "#fff", fillColor: css("--c-marker", check.parentElement), fillOpacity: 0.85 }]));
// Distance steps for the radius slider, evenly spaced on a log scale (finer at short distances).
const RADII = [0.1, 1, 10].flatMap((d) => [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8].map((m) => +(d * m).toFixed(2)))
  .filter((km) => km <= 50);
$("radius").max = RADII.length - 1;
const RADIUS_DEFAULT = RADII.indexOf(5);
$("radius").value = RADIUS_DEFAULT;
const radiusKm = () => RADII[+$("radius").value];
let shown = [], rows = [], plans = {}, selected = null, filtered = [];

const uniq = (xs) => [...new Set(xs)].sort((a, b) => a.localeCompare(b, "es"));
// The obra social's name leads its badges only while more than one is shown.
const badges = (r) => [
  ...(shown.length > 1 ? [`<span class="badge name os-${r.os}">${esc(OS[r.os].name)}</span>`] : []),
  ...(r.plans.length === plans[r.os].length && plans[r.os].length > 1 ? ["Todos los planes"] : r.plans)
    .map((p) => `<span class="badge os-${r.os}">${esc(p)}</span>`),
].join(" ");

// Rows of one obra social's cartilla (dosuba.json, unionpersonal.json), fetched once.
const cartillas = {};
function cartilla(os) {
  cartillas[os] ??= fetch(`${os}.json`).then((r) => r.json()).then((data) =>
    data.map((r) => {
      r.os = os;
      r.esps = r.especialidades.split(",").map((s) => s.trim()).filter(Boolean);
      r.espKeys = r.esps.map(norm);
      // DOSUBA separates phones with "|" or ",", Unión Personal with " / " (without spaces,
      // "4201-7185/8550" is one phone with two endings).
      r.phones = r.telefonos.split(/\s*[|,]\s*|\s+\/\s+/).filter(Boolean);
      r.text = norm([OS[os].name, r.nombre, r.direccion, r.localidad, r.tipo, r.especialidades,
        r.telefonos, r.horario, ...r.plans].join(" "));
      r.maps_url ||= "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(`${r.direccion.split(" - ")[0]}, ${r.localidad}`);
      if (r.lat != null) {
        r.marker = L.circleMarker([r.lat, r.lon], MARKERS[os]).bindPopup(() => popup(r));
        r.marker.on("click", () => highlight(r));
      }
      return r;
    }));
  return cartillas[os];
}

// Shows the chosen obra sociales, rebuilding the filters and keeping the location.
let loading = null;
async function load(oss) {
  loading = oss.join();
  $("status").textContent = "Cargando cartilla…";
  const data = await Promise.all(oss.map(cartilla));
  if (loading !== oss.join()) return; // another choice was made meanwhile

  shown = oss;
  document.documentElement.dataset.os = oss.length === 1 ? oss[0] : "both";
  $("notice").hidden = oss.length > 0;
  // Larger cartillas first, so their dots don't cover the smaller ones.
  rows = [...data].sort((a, b) => b.length - a.length).flat();
  rows.forEach((r, i) => {
    r.i = i;
    r.plan = (oss.length > 1 ? `${OS[r.os].name}: ` : "") + r.plans.join(", ");
  });
  selected?.marker?.setStyle(MARKERS[selected.os]);
  selected = null;

  // Filter options, keeping the current choices that still apply.
  plans = Object.fromEntries(oss.map((os, i) => [os, uniq(data[i].flatMap((r) => r.plans))]));
  const plan = $("plan").value;
  $("plan").length = 1;
  $("plan").querySelectorAll("optgroup").forEach((g) => g.remove());
  for (const os of oss) {
    let group = $("plan");
    if (oss.length > 1) {
      group = group.appendChild(document.createElement("optgroup"));
      group.label = OS[os].name;
    }
    for (const p of plans[os]) group.appendChild(new Option(p, `${os}|${p}`));
  }
  $("plan").value = plan;
  if ($("plan").selectedIndex < 0) $("plan").value = "";

  const tipo = $("tipo").value;
  const tipos = uniq(rows.map((r) => r.tipo).filter(Boolean));
  $("tipo").length = 1;
  for (const t of tipos) $("tipo").add(new Option(t, t));
  $("tipo").value = tipos.includes(tipo) ? tipo : "";
  $("tipo-label").hidden = !tipos.length;
  fillEsps();

  update(!!origin);
  if (!origin) showAll();
}

// Specialties offered by the chosen tipo, suggested while typing the especialidad.
// The cartillas spell them differently ("Cardiologia", "CARDIOLOGIA"): suggestions are
// deduplicated by norm(), preferring the spelling that is not all caps.
function fillEsps() {
  const tipo = $("tipo").value, labels = new Map();
  for (const r of rows) {
    if (tipo && r.tipo !== tipo) continue;
    r.esps.forEach((e, j) => {
      const k = r.espKeys[j], l = labels.get(k);
      if (!l || (l === l.toUpperCase() && e !== e.toUpperCase())) labels.set(k, e);
    });
  }
  const esps = [...labels].sort((a, b) => a[1].localeCompare(b[1], "es"));
  $("esps").replaceChildren(...esps.map(([, l]) => new Option(l)));
}

// Edit distance between two strings, for typo-tolerant matching.
function levenshtein(a, b) {
  let prev = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] !== b[j - 1]));
    prev = cur;
  }
  return prev[b.length];
}
// Whether a specialty (normalized) fuzzily matches the typed words: each word must be
// part of one of its words, or the start of one with a typo or two ("cardilogia",
// "traumatologo" match "Cardiologia", "Traumatologia").
function espMatches(key, words) {
  const kws = key.split(/[^a-z0-9]+/).filter(Boolean);
  return words.every((w) => kws.some((k) => k.includes(w) ||
    (w.length >= 4 && levenshtein(w, k.slice(0, w.length)) <= (w.length >= 8 ? 2 : 1))));
}

function popup(r) {
  return `<b>${esc(r.nombre)}</b><br>${esc(r.direccion)}, ${esc(r.localidad)}<br>
    <span class="small">${r.tipo ? `${esc(r.tipo)} · ` : ""}${esc(r.esps.join(", "))}</span><br>${phones(r)}
    ${r.horario ? `<span class="small">${escTel(r.horario)}</span><br>` : ""}${badges(r)}<br>
    ${r.dist != null ? `<b>${fmt(r.dist)}</b> · ` : ""}<a href="${esc(r.maps_url)}" target="_blank" rel="noopener">Google Maps</a>`;
}

let origin = null, originMarker = null, circle = null;
const state = { sortK: "dist", sortDir: 1 };

function setOrigin(lat, lon, label) {
  origin = { lat, lon };
  if (originMarker) originMarker.remove();
  originMarker = L.marker([lat, lon]).addTo(map).bindTooltip(label || "Ubicación elegida");
  update(true);
}
function clearOrigin() {
  origin = null;
  originMarker?.remove();
  originMarker = null;
  $("addr").value = "";
  update();
}
map.on("click", (e) => setOrigin(e.latlng.lat, e.latlng.lng));

// Address search: USIG normalizer (GCBA), falling back to Nominatim (OSM)
async function geocode(q) {
  try {
    const u = `https://servicios.usig.buenosaires.gob.ar/normalizar/?geocodificar=TRUE&srid=4326&direccion=${encodeURIComponent(q)}`;
    const d = await (await fetch(u)).json();
    const c = (d.direccionesNormalizadas || []).find((c) => c.coordenadas);
    if (c) return { lat: +c.coordenadas.y, lon: +c.coordenadas.x, label: c.direccion };
  } catch (e) { console.warn(e); }
  const u = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=${encodeURIComponent(q + ", Buenos Aires")}`;
  const d = await (await fetch(u)).json();
  if (d.length) return { lat: +d[0].lat, lon: +d[0].lon, label: d[0].display_name };
  return null;
}
async function search() {
  const q = $("addr").value.trim();
  if (!q) return;
  $("status").textContent = "Buscando dirección…";
  try {
    const g = await geocode(q);
    if (!g) { $("status").textContent = `No se encontró "${q}".`; return; }
    setOrigin(g.lat, g.lon, g.label);
  } catch (e) {
    $("status").textContent = "Error al geocodificar: " + e.message;
  }
}
$("go").onclick = search;
$("addr").onkeydown = (e) => { if (e.key === "Enter") search(); };
$("gps").onclick = () => navigator.geolocation?.getCurrentPosition(
  (p) => setOrigin(p.coords.latitude, p.coords.longitude, "Mi ubicación"),
  (e) => ($("status").textContent = "No se pudo obtener la ubicación: " + e.message),
);

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmt = (km) => (km < 1 ? `${Math.round(km * 1000)} m` : `${+km.toFixed(1)} km`);

function update(fit = false) {
  syncResets();
  const radius = radiusKm();
  $("rv").textContent = fmt(radius);
  const [planOs, plan] = $("plan").value.split("|"), tipo = $("tipo").value, esp = norm($("esp").value).split(/[^a-z0-9]+/).filter(Boolean), q = norm($("q").value).split(/\s+/).filter(Boolean);

  // Matched once per distinct specialty, not once per provider.
  const espHit = new Map(), espOk = (k) => {
    if (!espHit.has(k)) espHit.set(k, espMatches(k, esp));
    return espHit.get(k);
  };
  for (const r of rows) r.dist = origin && r.lat != null ? haversine(origin, r) : null;
  filtered = rows.filter((r) =>
    (!plan || (r.os === planOs && r.plans.includes(plan))) &&
    (!tipo || r.tipo === tipo) &&
    (!esp.length || r.espKeys.some(espOk)) &&
    q.every((w) => r.text.includes(w)) &&
    (!origin || (r.dist != null && r.dist <= radius)));

  if (circle) circle.remove();
  circle = origin ? L.circle([origin.lat, origin.lon], { radius: radius * 1000, color: css("--accent"), weight: 1, fillOpacity: 0.06, interactive: false }).addTo(map) : null;

  layer.clearLayers();
  for (const r of filtered) if (r.marker) layer.addLayer(r.marker);

  // Fitting the map triggers moveend, which renders the table.
  if (fit && circle) map.fitBounds(circle.getBounds());
  else renderTable();
}

// The table lists only the filtered providers inside the current map view.
function renderTable() {
  const bounds = map.getBounds();
  const out = filtered.filter((r) => r.marker && bounds.contains(r.marker.getLatLng()));
  const { sortK, sortDir } = state;
  out.sort((a, b) => {
    const x = a[sortK], y = b[sortK];
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "es")) * sortDir;
  });

  if (!shown.length) {
    $("status").textContent = "Elegí una cartilla para ver sus prestadores.";
    $("tb").innerHTML = "";
    return;
  }
  const noGeo = filtered.filter((r) => !r.marker).length;
  $("status").textContent = `${out.length} de ${filtered.length} en el mapa` +
    (origin ? ` · hasta ${fmt(radiusKm())}` : "") + (noGeo ? ` · ${noGeo} sin ubicar` : "");

  $("tb").innerHTML = out.map((r) => `<tr data-i="${r.i}">
    <td class="dist${r.dist != null ? "" : " none"}">${r.dist != null ? fmt(r.dist) : "–"}</td>
    <td class="nombre">${esc(r.nombre)}</td>
    <td class="direccion">${esc(r.direccion)}<br><span class="small">${esc(r.localidad)}</span></td>
    <td class="small esp">${esc(r.esps.join(", "))}${r.tipo ? `<br><i>${esc(r.tipo)}</i>` : ""}</td>
    <td class="small tel">${phones(r)}${r.horario ? escTel(r.horario) : ""}</td>
    <td class="plan">${badges(r)}</td></tr>`).join("");
  if (selected) document.querySelector(`tr[data-i="${selected.i}"]`)?.classList.add("sel");
  document.querySelectorAll("th").forEach((th) =>
    th.dataset.k === sortK ? (th.dataset.dir = sortDir) : delete th.dataset.dir);
}

function showAll() {
  const pts = filtered.filter((r) => r.marker).map((r) => r.marker.getLatLng());
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [20, 20], maxZoom: 16 });
}
map.on("moveend", renderTable);

// Marks the provider in the table and on the map, without moving the map.
function highlight(r) {
  document.querySelectorAll("tr.sel").forEach((t) => t.classList.remove("sel"));
  const tr = document.querySelector(`tr[data-i="${r.i}"]`);
  tr?.classList.add("sel");
  selected?.marker?.setStyle(MARKERS[selected.os]);
  selected = r;
  r.marker?.setStyle(MARKER_SEL).bringToFront();
}
$("tb").onclick = (e) => {
  const tr = e.target.closest("tr");
  if (tr) highlight(rows[+tr.dataset.i]);
};
document.querySelectorAll("th").forEach((th) => (th.onclick = () => {
  const k = th.dataset.k;
  state.sortDir = state.sortK === k ? -state.sortDir : 1;
  state.sortK = k;
  renderTable();
}));
$("toggle").onclick = () => {
  const open = $("side").classList.toggle("open");
  $("toggle").setAttribute("aria-expanded", open);
};
$("radius").oninput = () => update();
$("radius").onchange = () => update(true);
$("tipo").oninput = () => { fillEsps(); update(); };
for (const id of ["plan", "esp", "q"]) $(id).oninput = () => update();

// Reset buttons, one per filter, enabled while their filter is set.
const RESETS = {
  q: { set: () => !!$("q").value, reset: () => { $("q").value = ""; update(); } },
  addr: { set: () => !!(origin || $("addr").value), reset: clearOrigin },
  radius: { set: () => +$("radius").value !== RADIUS_DEFAULT, reset: () => { $("radius").value = RADIUS_DEFAULT; update(!!origin); } },
  plan: { set: () => !!$("plan").value, reset: () => { $("plan").value = ""; update(); } },
  tipo: { set: () => !!$("tipo").value, reset: () => { $("tipo").value = ""; fillEsps(); update(); } },
  esp: { set: () => !!$("esp").value, reset: () => { $("esp").value = ""; update(); } },
};
function syncResets() {
  document.querySelectorAll("#filters .reset").forEach((b) => (b.disabled = !RESETS[b.dataset.reset].set()));
}
document.querySelectorAll("#filters .reset").forEach((b) => (b.onclick = RESETS[b.dataset.reset].reset));
$("addr").addEventListener("input", syncResets);

// The obra sociales shown are kept in the URL (#dosuba,unionpersonal), so links keep them.
// None is chosen at first, so that only the cartillas the user asks for are downloaded.
function fromHash() {
  const oss = location.hash.slice(1).split(",").filter((os) => os in OS);
  for (const [os, { check }] of Object.entries(OS)) check.checked = oss.includes(os);
  load(oss);
}
for (const { check } of Object.values(OS)) check.onchange = () => {
  location.hash = Object.keys(OS).filter((os) => OS[os].check.checked).join(",");
};
window.onhashchange = fromHash;
fromHash();
</script>
</body>
